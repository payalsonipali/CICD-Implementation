name: Android CI with Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test # This will fail if unit tests don't pass

      # Optional: If you have instrumented tests
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
         api-level: 30
         target: default
         arch: x86_64
         profile: Nexus 5
         script: ./gradlew connectedCheck # This will fail if instrumented tests don't pass

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk